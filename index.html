<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1015">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>日轮 · 角色配色</title>
<style>
  :root{
    --bg:#0e1015; --card:#181b23; --card2:#20242e; --line:#2b3040;
    --fg:#eef0f5; --dim:#8b93a6; --accent:#33CCBB;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-text-size-adjust:100%}
  body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:620px;margin:0 auto;padding:14px 14px 40px}

  header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.3px}
  h1 small{display:block;font-size:11px;color:var(--dim);font-weight:400;margin-top:2px;letter-spacing:0}
  .spacer{flex:1}

  button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
  .btn{padding:9px 16px;border-radius:11px;background:var(--accent);color:#04211e;
    font-weight:650;font-size:14px;transition:transform .08s,opacity .15s}
  .btn:active{transform:scale(.96)}
  .btn.ghost{background:var(--card2);color:var(--fg);border:1px solid var(--line);font-weight:500}
  .btn:disabled{opacity:.45}

  .dot{width:8px;height:8px;border-radius:50%;background:#4a5063;flex:none}
  .dot.on{background:#3ddc84;box-shadow:0 0 8px #3ddc84}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:12px}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .lbl{font-size:12px;color:var(--dim);margin-bottom:8px;letter-spacing:.2px}

  .chip{padding:7px 13px;border-radius:10px;background:var(--card2);border:1px solid var(--line);
    font-size:13px;transition:.12s}
  .chip.sel{background:var(--accent);color:#04211e;border-color:transparent;font-weight:650}

  input[type=search],select{font:inherit;font-size:14px;color:var(--fg);background:var(--card2);
    border:1px solid var(--line);border-radius:11px;padding:10px 12px;width:100%;outline:none;
    -webkit-appearance:none;appearance:none}
  select{background-image:linear-gradient(45deg,transparent 50%,#8b93a6 50%),linear-gradient(135deg,#8b93a6 50%,transparent 50%);
    background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;
    padding-right:34px}
  input[type=range]{width:100%;accent-color:var(--accent)}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  @media(min-width:460px){.grid{grid-template-columns:repeat(4,1fr)}}
  .ch{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 6px 8px;
    display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .08s}
  .ch:active{transform:scale(.94)}
  .ch.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .ch img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#0b0d12;
    display:block;flex:none}
  .ch .nm{font-size:11px;line-height:1.25;text-align:center;color:var(--fg);
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ch .dots{display:flex;align-items:center;gap:4px}
  .ch .sw{width:9px;height:9px;border-radius:50%;border:1px solid rgba(255,255,255,.55)}
  .ch .hx{font-size:9px;color:var(--dim);font-family:ui-monospace,Menlo,monospace}

  .status{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:rgba(14,16,21,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);
    font-size:12px;color:var(--dim);display:flex;gap:8px;align-items:center}
  .status b{color:var(--fg);font-weight:600}
  .status .fr{font-family:ui-monospace,Menlo,monospace;font-size:10px;opacity:.7;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .hide{display:none!important}
  .warn{background:#2a1f10;border:1px solid #6b4a17;color:#ffcc80;font-size:12px;
    padding:10px 12px;border-radius:12px;margin-bottom:12px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="dot" id="dot"></div>
    <h1>日轮 · 角色配色<small id="sub">点角色 → 灯变应援色</small></h1>
    <div class="spacer"></div>
    <button class="btn" id="connectBtn">连接</button>
  </header>

  <div id="warn" class="warn hide"></div>

  <div class="panel">
    <div class="lbl">灯光模式</div>
    <div class="row" id="modes"></div>
    <div class="lbl" style="margin-top:14px">亮度 <span id="brightVal">100%</span></div>
    <input type="range" id="bright" min="10" max="100" value="100">
    <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--dim);line-height:1.4">
      <input type="checkbox" id="allDev" style="width:16px;height:16px;flex:none">
      <span>搜不到灯？勾上后显示全部蓝牙设备（逐个试）</span>
    </label>
  </div>

  <div class="panel">
    <div class="row" style="gap:8px">
      <input type="search" id="search" placeholder="搜索角色" style="flex:1;min-width:130px">
      <select id="band" style="flex:1;min-width:130px"></select>
    </div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="status">
  <span id="stat"><b>未连接</b> · 先点右上角「连接」</span>
  <span class="fr" id="frame"></span>
</div>

/* ============ 颜色管线：与 Android 端逐行一致 ============ */
const COLOR_TX_GAMMA = 2.2;
const clampInt = (v, lo, hi) => Math.min(Math.max(v, lo), hi);

function hexToRgb(hex) {
  const s = String(hex || '').trim().replace(/^#/, '');
  if (!/^[0-9a-fA-F]{6}$/.test(s)) return null;
  return [parseInt(s.slice(0, 2), 16), parseInt(s.slice(2, 4), 16), parseInt(s.slice(4, 6), 16)];
}
function rgbToHsv(r, g, b) {
  // 用 Math.fround 精确模拟 Kotlin 的 Float(32位)，保证与安卓端结果逐位一致
  const f = Math.fround;
  const rn = f(r / 255), gn = f(g / 255), bn = f(b / 255);
  const max = Math.max(rn, gn, bn), min = Math.min(rn, gn, bn);
  const d = f(max - min);
  let h = 0;
  if (d > f(1e-6)) {
    if (max === rn) h = f(f(f(gn - bn) / d) % 6);
    else if (max === gn) h = f(f(f(bn - rn) / d) + 2);
    else h = f(f(f(rn - gn) / d) + 4);
    h = f(h * 60);
    if (h < 0) h = f(h + 360);
  }
  const s = max === 0 ? 0 : f(d / max);
  return { h: Math.trunc(h) % 360, s: Math.trunc(f(s * 255)), v: Math.trunc(f(max * 255)) };
}
function hsvToRgb(h, s, v) {
  const f = Math.fround;
  const sn = f(clampInt(s, 0, 255) / 255), vn = f(clampInt(v, 0, 255) / 255);
  const hh = ((h % 360) + 360) % 360;
  const c = f(vn * sn);
  const x = f(c * f(1 - Math.abs(f(f(f(hh / 60) % 2) - 1))));
  const m = f(vn - c);
  let r1, g1, b1;
  if (hh < 60) { r1 = c; g1 = x; b1 = 0; }
  else if (hh < 120) { r1 = x; g1 = c; b1 = 0; }
  else if (hh < 180) { r1 = 0; g1 = c; b1 = x; }
  else if (hh < 240) { r1 = 0; g1 = x; b1 = c; }
  else if (hh < 300) { r1 = x; g1 = 0; b1 = c; }
  else { r1 = c; g1 = 0; b1 = x; }
  return [Math.trunc(f(f(r1 + m) * 255)), Math.trunc(f(f(g1 + m) * 255)), Math.trunc(f(f(b1 + m) * 255))];
}
function sanitizeLampHsv(next, fallbackHue) {
  let h = next.h;
  const s = next.s, v = next.v;
  if (v <= 0) h = fallbackHue;
  return { h: clampInt(h, 0, 359), s: clampInt(s, 0, 255), v: clampInt(v, 0, 255) };
}
function gammaEncode8bit(channel, gamma) {
  const n = clampInt(channel, 0, 255) / 255;
  return clampInt(Math.trunc(Math.pow(n, gamma) * 255 + 0.5), 0, 255);
}
function applyGammaToHsvForTx(input) {
  const rgb = hsvToRgb(input.h, input.s, input.v);
  const corrected = [
    gammaEncode8bit(rgb[0], COLOR_TX_GAMMA),
    gammaEncode8bit(rgb[1], COLOR_TX_GAMMA),
    gammaEncode8bit(rgb[2], COLOR_TX_GAMMA),

  return sanitizeLampHsv(rgbToHsv(corrected[0], corrected[1], corrected[2]), input.h);

/* ============ Modbus RTU ============ */
function crc16Modbus(bytes) {
  let crc = 0xFFFF;
  for (const b of bytes) {
    crc ^= b & 0xFF;
    for (let i = 0; i < 8; i++) {
      crc = (crc & 1) ? ((crc >>> 1) ^ 0xA001) : (crc >>> 1);

  }
  return crc & 0xFFFF;
}

  const count = values.length, byteCount = count * 2;

  for (let i = 0; i < count; i++) {

  const base = [mode & 0xFFFF, clampInt(tx.h, 0, 359), clampInt(tx.s, 0, 255), clampInt(tx.v, 0, 255)];
  const values = (mode === 5) ? base : base.concat([128]);
  return { frame: buildWriteMultipleRegisters(0x0000, values), hue: tx.h };
}

/* ============ BLE ============ */
const UUID_SVC = 0xffe0, UUID_WRITE = 0xffe1, UUID_NOTIFY = 0xffe2;
let device = null, gatt = null, wchar = null, nchar = null, protoVerified = false;
let LAST_HUE = 0;

const $ = id => document.getElementById(id);
const dot = $('dot'), statEl = $('stat'), frameEl = $('frame'), btn = $('connectBtn');

function setStatus(html) { statEl.innerHTML = html; }

function bleSupported() { return !!(navigator.bluetooth && navigator.bluetooth.requestDevice); }

function showWarn(html) {
  const w = $('warn');
  w.innerHTML = html;
  w.classList.remove('hide');
}

(function initEnv() {
  if (!bleSupported()) {
    showWarn('⚠️ 这个浏览器不支持 Web Bluetooth。<br>iPhone 请用 <b>Bluefy</b> 打开本页，安卓请用 <b>Chrome</b>。');
    btn.disabled = true;
  } else if (!window.isSecureContext) {
    showWarn('⚠️ 当前不是 https 地址，蓝牙用不了。请用 https 打开本页（GitHub Pages 等）。');
    btn.disabled = true;
  }
})();

$('bright').addEventListener('input', e => {
  $('brightVal').textContent = e.target.value + '%';
});

btn.addEventListener('click', async () => {
  if (gatt && gatt.connected) {
    disconnect();
    return;
  }
  await connect();
});

async function connect() {
  try {
    btn.disabled = true;
    setStatus('<b>正在搜索设备…</b>');
    const useAll = $('allDev').checked;
    const opts = useAll
      ? { acceptAllDevices: true, optionalServices: [UUID_SVC] }
      : { filters: [{ services: [UUID_SVC] }], optionalServices: [UUID_SVC] };

    device = await navigator.bluetooth.requestDevice(opts);
    device.addEventListener('gattserverdisconnected', onDisconnected);

    setStatus('<b>正在连接 ' + (device.name || '设备') + '…</b>');
    gatt = await device.gatt.connect();

    const svc = await gatt.getPrimaryService(UUID_SVC);
    wchar = await svc.getCharacteristic(UUID_WRITE);
    try {
      nchar = await svc.getCharacteristic(UUID_NOTIFY);
      await nchar.startNotifications();
    } catch (e) { nchar = null; }

    dot.classList.add('on');
    btn.textContent = '断开';
    btn.classList.add('ghost');
    $('sub').textContent = device.name || '已连接';
    setStatus('<b>已连接</b> · 点角色试试');
  } catch (e) {
    handleBleError(e);
  } finally {
    btn.disabled = false;
  }
}

function handleBleError(e) {
  const m = (e && e.message) || String(e);
  if (/cancel|User cancelled|NotFoundError/i.test(m)) {
    setStatus('<b>已取消</b> · 没选设备');
  } else if (/GATT operation already in progress|NetworkError/i.test(m)) {
    setStatus('<b>连接失败</b> · 靠近一点再试，或先关掉 App 里的连接');
  } else {
    setStatus('<b>出错：</b>' + m);
  }
  disconnect(true);
}

function disconnect(silent) {
  try { if (gatt && gatt.connected) gatt.disconnect(); } catch (e) {}
  gatt = null; wchar = null; nchar = null; device = null;
  dot.classList.remove('on');
  btn.textContent = '连接';
  btn.classList.remove('ghost');
  $('sub').textContent = '点角色 → 灯变应援色';
  if (!silent) setStatus('<b>已断开</b>');
}

function onDisconnected() {
  gatt = null; wchar = null; nchar = null;
  dot.classList.remove('on');
  btn.textContent = '连接';
  btn.classList.remove('ghost');
  setStatus('<b>设备已断开</b> · 再点连接');
}

async function writeFrame(bytes) {
  if (!wchar) throw new Error('未连接');
  const props = wchar.properties || {};
  if (props.write && wchar.writeValueWithResponse) {
    await wchar.writeValueWithResponse(bytes);
  } else if (props.writeWithoutResponse && wchar.writeValueWithoutResponse) {
    await wchar.writeValueWithoutResponse(bytes);
  } else {
    await wchar.writeValue(bytes);
  }
}

async function pick(hex, mode, el) {
  const built = buildFrame(hex, mode, Number($('bright').value));
  if (!built) { setStatus('<b>颜色格式错误</b>'); return; }
  LAST_HUE = built.hue;

  document.querySelectorAll('.ch.sel').forEach(n => n.classList.remove('sel'));
  if (el) el.classList.add('sel');

  const hexStr = Array.from(built.frame).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
  frameEl.textContent = hexStr;

  if (!wchar) {
    setStatus('<b>' + hex + '</b> 已选（还没连灯，先点「连接」）');
    return;
  }
  try {
    await writeFrame(built.frame);
    setStatus('<b>已发送</b> · 模式' + mode + ' · ' + hex);
  } catch (e) {
    setStatus('<b>发送失败：</b>' + ((e && e.message) || e));
  }
}

/* ============ 界面 ============ */
const MODES = [
  { v: 3, t: '常亮' }, { v: 4, t: '呼吸' }, { v: 1, t: '流水' },
  { v: 2, t: '爆闪' }, { v: 5, t: '频谱' },
];
let mode = 3;

function renderModes() {
  const box = $('modes');
  box.innerHTML = '';
  MODES.forEach(m => {
    const b = document.createElement('button');
    b.className = 'chip' + (m.v === mode ? ' sel' : '');
    b.textContent = m.t;
    b.onclick = () => { mode = m.v; renderModes(); };
    box.appendChild(b);
  });
}
renderModes();

function buildBandSelect() {
  const bands = [...new Set(CHARACTERS.map(c => c.b).filter(Boolean))].sort();
  const sel = $('band');
  sel.innerHTML = '<option value="">全部组合</option>' +
    bands.map(b => '<option value="' + b.replace(/"/g, '&quot;') + '">' + b + '</option>').join('');
}

function renderGrid() {
  const q = $('search').value.trim().toLowerCase();
  const band = $('band').value;
  const list = CHARACTERS.filter(c =>
    (!band || c.b === band) && (!q || c.n.toLowerCase().includes(q))
  );
  const grid = $('grid');
  grid.innerHTML = '';
  for (const c of list) {
    const el = document.createElement('button');
    el.className = 'ch';
    el.innerHTML =
      '<img alt="" loading="lazy" src="' + c.i + '">' +
      '<div class="nm">' + c.n + '</div>' +
      '<div class="dots"><span class="sw" style="background:' + c.c + '"></span>' +
      '<span class="hx">' + c.c + '</span></div>';
    el.onclick = () => pick(c.c, mode, el);
    grid.appendChild(el);
  }
  if (!list.length) grid.innerHTML = '<div style="color:#8b93a6;font-size:13px;padding:10px">没找到角色</div>';
}

buildBandSelect();
$('search').addEventListener('input', renderGrid);
$('band').addEventListener('change', renderGrid);
renderGrid();
</script>
